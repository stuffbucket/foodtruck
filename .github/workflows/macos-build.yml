# Rebuild the signed .dmg for a tag that already exists.
#
#   gh workflow run macos-build.yml -f tag=v0.1.2
#
# Use this when the cut got as far as creating the tag but the artifact never
# landed — the builder run failed, the notary service timed out, the cut was
# interrupted, or the draft was deleted after the fact. The normal path is
# release-cut.yml; this is the recovery path for everything downstream of the
# tag, which is the one thing a re-cut cannot recreate.
#
# It creates the draft release if it is missing, so a tag whose draft was deleted
# is still rebuildable. It will NOT create the tag: that is release-cut.yml's job,
# and inventing a tag here would skip the "is this commit on main?" check.
#
# Like every workflow here this runs on ubuntu-latest and builds nothing itself.
#
# NOTE: there is deliberately NO `release: published` trigger. Immutable
# releases reject asset uploads after publish (HTTP 422), so a build fired on
# publish could never attach its artifact. Builds happen while the release is
# still a mutable draft.

name: macOS signed build (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.2"
        required: true
        type: string

permissions: {}

concurrency:
  group: macos-build-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  trigger:
    name: Dispatch builder
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # Recreate the draft release when it is missing, and poll for the uploaded
      # artifact. The tag is only ever read here, never written.
      contents: write # recreate the draft release on an existing tag
    steps:
      - name: Dispatch stuffbucket/macos-builder
        env:
          BUILDER_PAT: ${{ secrets.MACOS_BUILDER_PAT }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          # workflow_dispatch input is untrusted: validate before use, and never
          # interpolate it into this script body (it arrives via env).
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'${TAG}' is not a vX.Y.Z tag." >&2
            exit 1
          fi

          # Same preflight as release-cut.yml: prove the credential is live with a
          # read-only GET before doing anything else.
          if [ -z "${BUILDER_PAT:-}" ]; then
            echo "::error::MACOS_BUILDER_PAT is not set on this repo." >&2
            exit 1
          fi
          if ! GH_TOKEN="$BUILDER_PAT" gh api \
               repos/stuffbucket/macos-builder/actions/workflows/build.yml >/dev/null 2>&1; then
            echo "::error::MACOS_BUILDER_PAT cannot reach build.yml on stuffbucket/macos-builder." >&2
            echo "::error::It is expired, revoked, or no longer has Actions: read and write." >&2
            echo "::error::Mint a new one at https://github.com/settings/personal-access-tokens/new" >&2
            exit 1
          fi

          # The builder checks the client out at this tag, so it has to exist.
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::No tag ${TAG} in ${GITHUB_REPOSITORY}. Cut it first:" >&2
            echo "::error::  gh workflow run release-cut.yml -f version=${TAG}" >&2
            exit 1
          fi

          # The builder uploads onto an existing release, and immutable releases
          # reject assets after publish — so it must be a DRAFT before we dispatch.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::Release ${TAG} is already published. GitHub rejects asset uploads onto a" >&2
              echo "::error::published immutable release (HTTP 422), so the .dmg could never attach." >&2
              exit 1
            fi
            echo "Draft ${TAG} exists — reusing it."
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "$TAG" \
              --generate-notes
            echo "Recreated DRAFT release ${TAG}."
          fi

          VERSION="${TAG#v}"
          DMG="foodtruck-${VERSION}-darwin-arm64.dmg"

          has_asset() {
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[].name' 2>/dev/null | grep -Fxq "$1"
          }

          if has_asset "$DMG"; then
            echo "${DMG} is already attached — nothing to do."
            exit 0
          fi

          echo "Dispatching stuffbucket/macos-builder for ${GITHUB_REPOSITORY} at ${TAG}…"
          GH_TOKEN="$BUILDER_PAT" gh workflow run build.yml \
            --repo stuffbucket/macos-builder \
            --ref main \
            -f "repo=${GITHUB_REPOSITORY}" \
            -f "ref=${TAG}"

          echo "Waiting for ${DMG} on the ${TAG} draft…"
          for i in $(seq 1 40); do
            sleep 45
            if has_asset "$DMG"; then
              echo "${DMG} landed after ~$((i * 45))s."
              gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
                --jq '.assets[] | "  \(.name)  \(.size) bytes"'
              exit 0
            fi
          done

          echo "::error::Timed out waiting for ${DMG}. See https://github.com/stuffbucket/macos-builder/actions" >&2
          exit 1
